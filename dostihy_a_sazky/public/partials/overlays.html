  <!-- Space Inspect Overlay -->
  <div id="space-inspect-overlay" class="space-inspect-overlay hidden">

    <div class="space-inspect-content">
      <button class="space-inspect-close" id="space-inspect-close" aria-label="Zavřít"><img class="ui-icon" src="img/ui/zavrit.png" alt="" draggable="false" /></button>
      <!-- Detail nemá záhlaví (to je až uvnitř otáčecí karty), proto vlastní

      <div class="space-inspect-scene">
        <div id="space-inspect-card" class="space-inspect-card">
          <!-- Front Face -->
          <div class="space-inspect-face space-inspect-front">

            </div>
            <div class="space-inspect-media" id="space-inspect-icon"></div>

    </div>

  <!-- Ruleta -->
  <div id="roulette-overlay" class="roulette-overlay hidden">
    <div class="roulette-scene">
      <header class="roulette-head">
        <h2 class="roulette-title">Ruleta</h2>
        <div id="roulette-who" class="roulette-who"></div>
        <!-- Šance skupin dopočítává JS z vah výsečí. -->
        <div id="roulette-odds" class="roulette-odds"></div>
      </header>
      <div class="roulette-wheel-wrap">
        <!-- Ručička: kapka mířící dolů na ráfek, při točení ťuká o kolíky. -->
        <svg id="roulette-pointer" class="roulette-pointer" viewBox="0 0 30 40" aria-hidden="true">
          <path d="M15 39 L3 14 A13 13 0 1 1 27 14 Z" />
          <circle cx="15" cy="13" r="4.5" />
        </svg>
        <!-- Kolo kreslí JS jako SVG; pro odečítač je to šum, závazný
             výsledek nese .roulette-result pod kolem. -->
        <div id="roulette-wheel" class="roulette-wheel" aria-hidden="true"></div>
        <!-- Lesk a náboj stojí, kolo se točí pod nimi — světlo tak nepadá
             pokaždé odjinud. -->
        <div class="roulette-sheen" aria-hidden="true"></div>
        <div class="roulette-hub" aria-hidden="true"><img src="img/ruleta.png" alt="" draggable="false" /></div>
      </div>
      <div id="roulette-result" class="roulette-result" data-state="spinning" aria-live="polite">
        <div id="roulette-result-icon" class="roulette-result-icon"></div>
        <div id="roulette-result-name" class="roulette-result-name"></div>
        <div id="roulette-result-text" class="roulette-result-text"></div>
      </div>
      <!-- Patička drží místo i během točení, aby karta po dojetí neposkočila. -->
      <div class="roulette-foot">
        <button id="roulette-btn" class="btn btn-gold btn-lg is-hidden">Potvrdit</button>
        <div id="roulette-status" class="roulette-status is-hidden"></div>
      </div>
    </div>
  </div>

      <div class="space-inspect-scene">
        <div id="space-inspect-card" class="space-inspect-card">

          <div class="space-inspect-face space-inspect-front">

            <div class="space-inspect-body">

      <div class="roulette-result">
        <div id="roulette-result-icon" class="roulette-result-icon"></div>

  <!-- GAME -->
  <div id="game-view" class="hidden">

    <!-- Board -->
    <div id="board-wrap">
      <button id="view-mode-btn" class="view-mode-btn" type="button" title="Přepnout 2D / 3D pohled">3D</button>
      <canvas id="board-3d-canvas" class="hidden"></canvas>
      <div id="board">
        <!-- Board center (spaces added dynamically around it) -->
        <div id="board-center">
          <div class="bc-artwork"></div>
          <div class="bc-deck-area">
            <div class="bc-deck nahoda"><img class="bc-deck-icon" src="img/nahoda-znak.png" alt="" draggable="false" />NÁHODA</div>
            <div class="bc-deck finance"><img class="bc-deck-icon" src="img/finance.png" alt="" draggable="false" />FINANCE</div>
          </div>
          <div class="bc-logo-overlay">
            <div id="particles-container"></div>
            <h2 class="bc-title">DOSTIHY<br />A SÁZKY</h2>
            <div id="bc-turn" class="bc-turn"></div>
            <div class="dice-scene" id="dice-scene">
              <div id="dice-3d" class="dice-3d">
                <div class="dice-face face-front face-1"><span class="dot"></span></div>
                <div class="dice-face face-back face-6">
                  <div class="col"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
                  <div class="col"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
                </div>
                <div class="dice-face face-right face-3"><span class="dot"></span><span class="dot"></span><span
                    class="dot"></span></div>
                <div class="dice-face face-left face-4">
                  <div class="col"><span class="dot"></span><span class="dot"></span></div>
                  <div class="col"><span class="dot"></span><span class="dot"></span></div>
                </div>
                <div class="dice-face face-top face-5">
                  <div class="col"><span class="dot"></span><span class="dot"></span></div>
                  <div class="col center-col"><span class="dot"></span></div>
                  <div class="col"><span class="dot"></span><span class="dot"></span></div>
                </div>
                <div class="dice-face face-bottom face-2"><span class="dot"></span><span class="dot"></span></div>
              </div>
            </div>
            <div id="bc-round" class="bc-round"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Right panel -->
    <div id="right-panel">

      <div id="game-timer" class="game-timer hidden">
        <span class="timer-icon"><img class="ui-icon" src="img/ui/casovac.png" alt="" draggable="false" /></span>
        <span id="timer-value">00:00</span>
      </div>

      <!-- Mobile tab bar (hidden on desktop via CSS) -->
      <div id="mobile-tabs" class="mobile-tabs">
        <button class="mobile-tab active" data-tab="action">Akce</button>
        <button class="mobile-tab" data-tab="players">Hráči</button>
        <button class="mobile-tab" data-tab="log">Log</button>
      </div>

      <section id="players-section">
        <h2 class="section-title">Hráči</h2>
        <div id="players-list"></div>
      </section>

      <section id="action-section">
        <h2 class="section-title" id="action-title">Akce</h2>
        <div id="action-content">
          <p class="dim">Čekám na hru...</p>
        </div>
      </section>

      <section id="log-section" class="is-collapsed">
        <h2 class="section-title">
          <button id="log-toggle" class="log-toggle" type="button" aria-expanded="false" aria-controls="log-list">
            Průběh <span class="log-caret" aria-hidden="true"></span>
          </button>
        </h2>
        <div id="log-list"></div>
      </section>

      <div style="padding: 10px; border-top: 1px solid var(--border); display: flex; gap: 8px;">
        <button id="game-leave-btn" class="btn btn-outline btn-xs" style="flex:1">Odpojit se</button>
      </div>

    </div>

    <!-- Debug tlačítko — zobrazí se jen při ?debug v URL -->
    <button id="debug-btn" class="debug-btn hidden" title="Debug">🐞</button>

    <!-- Debug panel overlay -->
    <div id="debug-panel" class="debug-overlay hidden">
      <div class="debug-modal">
        <div class="debug-header">
          <h3>🐞 Debug stav hry</h3>
          <button id="debug-close" class="debug-close" aria-label="Zavřít"><img class="ui-icon" src="img/ui/zavrit.png" alt="" draggable="false" /></button>
        </div>
        <div id="debug-body" class="debug-body"></div>
        <div class="debug-footer">
          <button id="debug-cancel" class="btn btn-outline btn-sm">Zrušit</button>
          <button id="debug-apply" class="btn btn-gold btn-sm">Použít</button>
        </div>
      </div>
    </div>

  </div>
